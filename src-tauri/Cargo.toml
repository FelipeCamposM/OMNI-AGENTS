[package]
name = "omni-agents"
version = "0.7.9"
description = "OMNI AGENTS desktop workspace"
authors = []
edition = "2021"

[lib]
name = "omni_agents_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Já vem na árvore via tauri; declarado aqui só para gerar o --session-id do Claude.
uuid = { version = "1", features = ["v4"] }
# Já vem na árvore via tauri; lê o `config.toml` do Codex na aba Extensões.
toml = "0.9"
tokio = { version = "1", features = ["full"] }
omni-protocol = { path = "../crates/omni-protocol" }
omni-core = { path = "../crates/omni-core" }
# Já vêm na árvore (reqwest/rustls como o updater usa, base64 via omni-core); buscam o ícone de MCP remoto (`icones_remotos.rs`).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

# Já vêm na árvore via tauri (wry); liberam o microfone no WebView2 sem o aviso nativo (`microfone.rs`).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
