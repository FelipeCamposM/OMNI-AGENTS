[package]
name = "omni-agents"
version = "0.2.0"
description = "OMNI AGENTS desktop workspace"
authors = []
edition = "2021"

[lib]
name = "omni_agents_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Já vem na árvore via tauri; declarado aqui só para gerar o --session-id do Claude.
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
omni-protocol = { path = "../crates/omni-protocol" }
omni-core = { path = "../crates/omni-core" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
