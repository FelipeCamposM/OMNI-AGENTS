# Gera os instaladores de Windows, macOS e Linux e monta um Release em RASCUNHO com o latest.json
# unificado. Disparo: `git tag v0.5.0 && git push origin v0.5.0` (a tag tem que bater com VERSION).
#
# Rascunho de propósito: nada chega aos usuários até alguém conferir e clicar "Publish release".
# Publicar como release normal, NUNCA como pre-release — o updater lê `releases/latest`, que ignora
# pre-releases (ver CLAUDE.md, "Dois tipos de Release").
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           conteúdo de ~/.tauri/<chave>.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  senha da chave
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: universal-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Tag confere com VERSION
        run: |
          test "v$(cat VERSION | tr -d '[:space:]')" = "${GITHUB_REF_NAME}" \
            || { echo "Tag ${GITHUB_REF_NAME} diferente de VERSION ($(cat VERSION))"; exit 1; }
          node scripts/sync-version.mjs --check

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Dependências do Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - run: npm ci

      - run: node scripts/build-engine.mjs --release --target ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: OMNI AGENTS ${{ github.ref_name }}
          releaseBody: Instaladores para Windows, macOS e Linux. Veja as novidades dentro do app.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
          # O Windows instala e atualiza pelo NSIS (os hooks que encerram o engine moram nele).
          updaterJsonPreferNsis: true
